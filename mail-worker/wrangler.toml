name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "3ea5a181-b944-4a4e-8d10-74632e65260e"

[[kv_namespaces]]
binding = "kv"
id = "819de2a0366f4f91b4695160bc1ea209"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloudmail"

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
TIMED_MAIL_ENABLED = true
TIMED_MAIL_DOMAIN = "getvulpe.com"
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm run test:timed && pnpm --prefix ../mail-vue install --frozen-lockfile && pnpm --prefix ../mail-vue run build"
