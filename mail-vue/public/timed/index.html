<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>VulpeLabs · 专属收件箱</title><link rel="stylesheet" href="/timed/style.css"><script src="/timed/app.js" defer></script></head>
<body><header><a href="https://getvulpe.com">VULPE<span>LABS</span></a><small>专属收件箱</small></header><main>
<section id="auth"><p class="eyebrow">PRIVATE MAIL</p><h1>你的邮箱，只属于你。</h1><p>兑换一次性卡密，开启 10 分钟收件时间。每轮最多创建 20 个全新地址，续时后保留已有邮箱。</p>
<form id="auth-form"><label>账号<input id="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_-]+" placeholder="字母、数字或下划线"></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128" placeholder="至少 12 位"></label><label id="register-code" hidden>一次性卡密<input id="initial-code" autocomplete="off" maxlength="48"></label><button id="submit-auth">登录</button><button type="button" id="toggle" class="secondary">首次使用？用卡密注册</button></form><p class="note">请保存账号和密码。新设备登录会使旧登录失效。</p></section>
<section id="dashboard" hidden><div class="top"><div><p class="eyebrow" id="account-name"></p><h1>专属收件箱</h1></div><button id="logout" class="secondary">退出</button></div>
<div class="metrics"><div><small>剩余时间</small><strong id="countdown">—</strong></div><div><small>本轮可创建</small><strong id="quota">—</strong></div><div><small>已保留邮箱</small><strong id="total">—</strong></div></div>
<form id="redeem-form" class="inline"><input id="renew-code" aria-label="新的卡密" placeholder="输入新的未使用卡密" required maxlength="48" autocomplete="off"><button>兑换并续时</button></form><p class="note">每张新卡增加 10 分钟，并把本轮名额重置为 20。到期后保留邮箱和邮件，暂停收件和阅读。</p>
<div class="top"><h2>我的邮箱</h2><button id="create">创建全新邮箱</button></div><div class="workspace"><nav id="boxes" aria-label="邮箱列表"></nav><section class="inbox"><div class="top"><h2 id="selected">选择邮箱</h2><button id="refresh" class="secondary">刷新</button></div><div id="messages"></div><article id="message" hidden><h2 id="subject"></h2><p id="sender" class="note"></p><pre id="body"></pre><p id="attachments" class="note"></p></article></section></div><p class="note">仅支持收件。单封邮件上限 1 MiB；显示最近 100 封邮件，附件暂不提供下载。</p></section>
<p id="notice" role="status" aria-live="polite"></p></main><footer>VulpeLabs · 独立账号 · 私密收件</footer></body></html>
