<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><title>VulpeLabs · 卡密管理</title><link rel="stylesheet" href="/timed/style.css"><script src="/timed/admin.js" defer></script></head><body><header><a href="/timed/">VULPE<span>LABS</span></a><small>管理员</small></header><main><section id="auth"><h1>生成一次性卡密</h1><p>使用现有邮箱系统的管理员账号登录。每张卡增加 10 分钟并重置 20 个创建名额。</p><form id="login"><label>管理员邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><form id="generate" hidden><label>生成数量<input id="count" type="number" min="1" max="100" value="10" required></label><button>生成并下载卡密</button><button id="logout" type="button" class="secondary">退出</button></form><p class="note">完整卡密仅在生成时返回，请保存下载文件。服务器只保存摘要，无法找回原文。</p><pre id="codes"></pre><p id="notice" role="status"></p></section></main></body></html>
